<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人简历 · NBUSAI</title>
<meta name="description" content="教师个人学术简历：研究方向、教育经历、科研项目、论文发表、专利软著、社会服务、学生指导与教学经历。数据实时同步自教师工作台。">
<meta name="theme-color" content="#102a52">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="cv-body">

<div id="cv" v-cloak>

  <!-- ==================== 加载中 ==================== -->
  <div v-if="loading" class="cv-loading">
    <div class="cv-spinner" aria-hidden="true"></div>
    <p>正在加载简历…</p>
  </div>

  <!-- ==================== 无法访问 / 链接失效 ==================== -->
  <main v-else-if="!data" class="cv-locked">
    <div class="cv-lock-card">
      <div class="cv-lock-ico" :class="'st-' + state">
        <fwb-icon :name="state === 'invalid' ? 'alert' : 'lock'" :size="30"></fwb-icon>
      </div>
      <h1>{{ lockedTitle }}</h1>
      <p>{{ message }}</p>
      <p class="cv-lock-foot" v-if="state === 'invalid'">请向本人索取完整的简历链接。</p>
      <p class="cv-lock-foot" v-else>简历链接仍然有效，待本人重新公开后即可访问。</p>
    </div>
  </main>

  <!-- ==================== 简历正文 ==================== -->
  <template v-else>

    <!-- ---------- 吸顶导航 ---------- -->
    <header class="cv-top">
      <div class="cv-top-in">
        <a class="cv-brand" href="#top">
          <span class="cv-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 18.5V5.5l12 13V5.5"/>
              <circle cx="6" cy="5.5" r="1.85" fill="currentColor" stroke="none"/>
              <circle cx="6" cy="18.5" r="1.85" fill="currentColor" stroke="none"/>
              <circle cx="18" cy="5.5" r="1.85" fill="currentColor" stroke="none"/>
              <circle cx="18" cy="18.5" r="1.85" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span class="cv-brand-text"><b>{{ data.name }}</b><small>学术简历</small></span>
        </a>

        <nav class="cv-nav" aria-label="简历章节导航">
          <a v-for="n in navItems" :key="n.id" :href="'#' + n.id"
             class="cv-nav-link" :class="{ on: activeId === n.id }">
            <span>{{ n.text }}</span><i v-if="n.count" class="cv-nav-n">{{ n.count }}</i>
          </a>
        </nav>

        <button class="cv-print" type="button" @click="print" title="打印或导出为 PDF">
          <fwb-icon name="download" :size="15"></fwb-icon>打印 / PDF
        </button>
      </div>
    </header>

    <!-- ---------- 头部名片 ---------- -->
    <section class="cv-hero" id="top">
      <div class="cv-hero-in">
        <div class="cv-avatar">
          <img v-if="avatarUrl" :src="avatarUrl" :alt="data.name" @error="avatarFailed = true">
          <span v-else class="cv-avatar-fb">{{ (data.name || '?').charAt(0) }}</span>
        </div>

        <div class="cv-hero-main">
          <h1>{{ data.name }}<span v-if="data.profile.ename" class="cv-ename">{{ data.profile.ename }}</span></h1>
          <div class="cv-role">
            <span v-if="data.profile.title" class="cv-role-title">{{ data.profile.title }}</span>
            <span v-if="data.profile.dept">{{ data.profile.dept }}</span>
          </div>
          <p v-if="data.profile.tagline" class="cv-tagline">{{ data.profile.tagline }}</p>

          <div class="cv-contacts">
            <span v-if="data.profile.email" class="cv-contact">
              <fwb-icon name="send" :size="14"></fwb-icon>
              <a :href="'mailto:' + data.profile.email">{{ data.profile.email }}</a>
            </span>
            <span v-if="data.profile.phone" class="cv-contact">
              <fwb-icon name="bell" :size="14"></fwb-icon>{{ data.profile.phone }}
            </span>
            <span v-if="data.profile.office" class="cv-contact">
              <fwb-icon name="pin" :size="14"></fwb-icon>{{ data.profile.office }}
            </span>
            <span v-if="data.profile.address" class="cv-contact">
              <fwb-icon name="building" :size="14"></fwb-icon>{{ data.profile.address }}
            </span>
            <a v-if="data.profile.homepage" class="cv-contact" :href="data.profile.homepage"
               target="_blank" rel="noopener noreferrer">
              <fwb-icon name="globe" :size="14"></fwb-icon>{{ hostOf(data.profile.homepage) }}
            </a>
            <a v-if="data.profile.orcid" class="cv-contact"
               :href="'https://orcid.org/' + data.profile.orcid" target="_blank" rel="noopener noreferrer">
              <fwb-icon name="user" :size="14"></fwb-icon>ORCID {{ data.profile.orcid }}
            </a>
            <a v-if="data.profile.scholar" class="cv-contact" :href="data.profile.scholar"
               target="_blank" rel="noopener noreferrer">
              <fwb-icon name="book" :size="14"></fwb-icon>学术主页
            </a>
          </div>
        </div>

        <!-- 关键数字 -->
        <ul v-if="on('stats') && statRows.length" class="cv-stats">
          <li v-for="s in statRows" :key="s.lab" class="cv-stat">
            <span class="cv-stat-ico" :class="'t-' + s.tone"><fwb-icon :name="s.icon" :size="16"></fwb-icon></span>
            <span class="cv-stat-val">{{ s.val }}<small>{{ s.unit }}</small></span>
            <span class="cv-stat-lab">{{ s.lab }}</span>
          </li>
        </ul>
      </div>
    </section>

    <!-- ---------- 正文 ---------- -->
    <main class="cv-main">

      <!-- 个人简介 -->
      <section v-if="on('bio') && data.profile.bio" class="cv-sec" id="bio">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>个人简介</h2>
        <p class="cv-bio">{{ data.profile.bio }}</p>
      </section>

      <!-- 研究方向 -->
      <section v-if="on('directions') && data.directions.length" class="cv-sec" id="directions">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>研究方向</h2>
        <div class="cv-dirs">
          <span v-for="d in data.directions" :key="d" class="cv-chip">{{ d }}</span>
        </div>
      </section>

      <!-- 教育经历 -->
      <section v-if="on('educations') && data.educations.length" class="cv-sec" id="education">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>教育经历</h2>
        <ol class="cv-timeline">
          <li v-for="e in data.educations" :key="e.id" class="cv-tl-item">
            <div class="cv-tl-when">{{ period(e.from, e.to) }}</div>
            <div class="cv-tl-body">
              <div class="cv-tl-head">
                <b>{{ e.school }}</b>
                <span v-if="e.degree" class="cv-badge">{{ e.degree }}</span>
              </div>
              <div class="cv-tl-sub">{{ [e.major, e.supervisor ? '导师：' + e.supervisor : ''].filter(Boolean).join(' · ') }}</div>
              <p v-if="e.note" class="cv-tl-note">{{ e.note }}</p>
            </div>
          </li>
        </ol>
      </section>

      <!-- 项目经历 -->
      <section v-if="on('projects') && data.projects.length" class="cv-sec" id="projects">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>科研项目
          <span class="cv-h2-note">主持 {{ data.stats.projectsLeading }} 项 · 累计经费 {{ data.stats.funding }} 万元</span>
        </h2>
        <div class="cv-list">
          <article v-for="p in data.projects" :key="p.id" class="cv-item">
            <div class="cv-item-head">
              <h3>{{ p.name }}</h3>
              <span v-if="p.role" class="cv-badge" :class="p.role === '主持' ? 'accent' : ''">{{ p.role }}</span>
              <span v-if="p.status" class="cv-badge soft">{{ p.status }}</span>
            </div>
            <div class="cv-item-meta">
              <span v-if="p.type">{{ p.type }}</span>
              <span v-if="p.code">编号 {{ p.code }}</span>
              <span>{{ period(p.startDate, p.deadline) }}</span>
              <span v-if="fundingText(p.funding)">经费 {{ fundingText(p.funding) }} 万元</span>
            </div>
            <p v-if="p.desc" class="cv-item-desc">{{ p.desc }}</p>
          </article>
        </div>
      </section>

      <!-- 论文发表 -->
      <section v-if="on('papers') && data.papers.length" class="cv-sec" id="publications">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>论文发表
          <span class="cv-h2-note">共 {{ data.papers.length }} 篇<span v-if="levelNote"> · {{ levelNote }}</span></span>
        </h2>
        <div v-for="g in paperGroups" :key="g.year" class="cv-year">
          <div class="cv-year-lab">{{ g.year || '待发表' }}</div>
          <ol class="cv-pubs">
            <li v-for="p in g.items" :key="p.id" class="cv-pub">
              <span class="cv-pub-no">[{{ p.no }}]</span>
              <div class="cv-pub-body">
                <div class="cv-pub-title">
                  {{ p.title }}
                  <span v-if="p.role && p.role !== '第一作者'" class="cv-pub-role">{{ p.role }}</span>
                </div>
                <div class="cv-pub-authors">
                  <template v-for="(seg, i) in authorParts(p.authors)" :key="i">
                    <b v-if="seg.me">{{ seg.t }}</b><template v-else>{{ seg.t }}</template>
                  </template>
                </div>
                <div class="cv-pub-venue">
                  <i>{{ p.venue }}</i>
                  <span v-if="p.level" class="cv-badge soft">{{ p.level }}</span>
                  <span v-if="p.status && !isDone(p.status)" class="cv-badge wait">{{ p.status }}</span>
                  <a v-if="doiUrl(p.doi)" class="cv-doi" :href="doiUrl(p.doi)"
                     target="_blank" rel="noopener noreferrer">DOI</a>
                  <span v-else-if="p.doi && p.doi !== '—'" class="cv-doi plain">{{ p.doi }}</span>
                </div>
              </div>
            </li>
          </ol>
        </div>
      </section>

      <!-- 专利软著 -->
      <section v-if="on('patents') && data.patents.length" class="cv-sec" id="patents">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>专利与软件著作权
          <span class="cv-h2-note">共 {{ data.patents.length }} 项</span>
        </h2>
        <ol class="cv-pubs">
          <li v-for="p in data.patents" :key="p.id" class="cv-pub">
            <span class="cv-pub-no"><fwb-icon name="seal" :size="15"></fwb-icon></span>
            <div class="cv-pub-body">
              <div class="cv-pub-title">{{ p.title }}
                <span v-if="p.role" class="cv-pub-role">{{ p.role }}</span>
              </div>
              <div class="cv-pub-authors">{{ p.authors }}</div>
              <div class="cv-pub-venue">
                <i>{{ p.venue }}</i>
                <span v-if="p.type" class="cv-badge soft">{{ p.type }}</span>
                <span v-if="p.level && p.level !== p.type" class="cv-badge soft">{{ p.level }}</span>
                <span v-if="p.date" class="cv-pub-date">{{ p.date }}</span>
                <span v-if="p.doi && p.doi !== '—'" class="cv-doi plain">{{ p.doi }}</span>
                <span v-if="p.status" class="cv-badge soft">{{ p.status }}</span>
              </div>
            </div>
          </li>
        </ol>
      </section>

      <!-- 社会服务 -->
      <section v-if="on('services') && data.services.length" class="cv-sec" id="services">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>社会服务
          <span class="cv-h2-note">共 {{ data.services.length }} 项</span>
        </h2>
        <div v-for="g in serviceGroups" :key="g.kind" class="cv-svc-group">
          <div class="cv-svc-kind">{{ g.kind }}</div>
          <ul class="cv-svc-list">
            <li v-for="s in g.items" :key="s.id" class="cv-svc">
              <div class="cv-svc-org">{{ s.org }}<span v-if="s.role" class="cv-svc-role">{{ s.role }}</span></div>
              <div class="cv-svc-when">{{ period(s.from, s.to) || '—' }}</div>
              <p v-if="s.note" class="cv-svc-note">{{ s.note }}</p>
            </li>
          </ul>
        </div>
      </section>

      <!-- 学生指导 -->
      <section v-if="on('students') && data.students.length" class="cv-sec" id="students">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>学生指导
          <span class="cv-h2-note">共 {{ data.stats.students }} 人 · 博士 {{ data.stats.studentsPhd }} · 硕士 {{ data.stats.studentsMaster }}</span>
        </h2>
        <div class="cv-students">
          <article v-for="s in data.students" :key="s.id" class="cv-student">
            <div class="cv-stu-head">
              <span class="cv-stu-ava">{{ (s.name || '?').charAt(0) }}</span>
              <b>{{ s.name }}</b>
              <span v-if="s.degree" class="cv-badge soft">{{ s.degree }}</span>
              <span v-if="s.grade" class="cv-stu-grade">{{ s.grade }}</span>
            </div>
            <div v-if="s.direction" class="cv-stu-dir">{{ s.direction }}</div>
            <div v-if="s.thesisTitle" class="cv-stu-thesis" :title="s.thesisTitle">{{ s.thesisTitle }}</div>
            <div v-if="s.stage" class="cv-stu-stage"><fwb-icon name="target" :size="13"></fwb-icon>{{ s.stage }}</div>
          </article>
        </div>
      </section>

      <!-- 教学经历 -->
      <section v-if="on('teachings') && data.teachings.length" class="cv-sec" id="teaching">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>教学经历
          <span class="cv-h2-note">{{ data.stats.teachings }} 门课程 · 累计 {{ data.stats.hours }} 学时</span>
        </h2>
        <div class="cv-table-wrap">
          <table class="cv-table">
            <thead>
              <tr><th>课程名称</th><th>课程代码</th><th>开课学期</th><th>课程类型</th><th class="num">人数</th><th class="num">学时</th></tr>
            </thead>
            <tbody>
              <tr v-for="t in data.teachings" :key="t.id">
                <td class="cv-strong">{{ t.name }}</td>
                <td>{{ t.code || '—' }}</td>
                <td>{{ t.semester || '—' }}</td>
                <td><span v-if="t.type" class="cv-badge soft">{{ t.type }}</span></td>
                <td class="num">{{ t.students || '—' }}</td>
                <td class="num">{{ t.hours || '—' }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 荣誉与奖励 -->
      <section v-if="on('honors') && data.honors.length" class="cv-sec" id="honors">
        <h2 class="cv-h2"><span class="cv-h2-bar"></span>荣誉与奖励</h2>
        <ol class="cv-pubs">
          <li v-for="h in data.honors" :key="h.id" class="cv-pub">
            <span class="cv-pub-no"><fwb-icon name="award" :size="15"></fwb-icon></span>
            <div class="cv-pub-body">
              <div class="cv-pub-title">{{ h.title }}</div>
              <div class="cv-pub-authors">{{ h.authors }}</div>
              <div class="cv-pub-venue">
                <i>{{ h.venue }}</i>
                <span v-if="h.level" class="cv-badge soft">{{ h.level }}</span>
                <span v-if="h.date" class="cv-pub-date">{{ h.date }}</span>
              </div>
            </div>
          </li>
        </ol>
      </section>

      <!-- 全空兜底 -->
      <div v-if="isEmpty" class="cv-empty">
        <fwb-icon name="info" :size="26"></fwb-icon>
        <p>这份简历还没有可展示的内容。工作台里录入项目、成果或教学数据后，本页会自动呈现。</p>
      </div>

    </main>

    <footer class="cv-foot">
      <span>本页由 <b>NBUSAI 教师工作台</b> 自动生成 · 数据实时同步</span>
      <span v-if="data.updatedAt">最近更新 {{ data.updatedAt.slice(0, 10) }}</span>
    </footer>

  </template>
</div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/cv-public.js"></script>
</body>
</html>
